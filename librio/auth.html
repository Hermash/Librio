<!DOCTYPE html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Вхід | Librio</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <header>
      <h1>Вхід у профіль</h1>
    </header>

    <main>
      <h1>Вхід у систему</h1>
      <p>Увійдіть, щоб переглянути свій профіль і бібліотеку.</p>

      <form action="profile.html" method="post">
        <label for="email">Електронна пошта:</label><br />
        <input
          type="email"
          id="email"
          name="email"
          placeholder="example@email.com"
          required
        /><br /><br />

        <label for="password">Пароль:</label><br />
        <input
          type="password"
          id="password"
          name="password"
          placeholder="********"
          required
        /><br /><br />

        <button type="submit">Увійти</button>
      </form>

      <p>Ще не маєте акаунта? <a href="#">Зареєструйтесь</a></p>
    </main>

    <footer class="site-footer">
      <div class="footer-content">
        <div class="footer-logo">
          <img src="images/logo1.png" alt="Логотип Librio" width="50" />
        </div>

        <div class="footer-links">
          <a href="index.html">Головна</a>
          <a href="catalog.html">Каталог</a>
          <a href="about.html">Про нас</a>
          <a href="contacts.html">Контакти</a>
        </div>

        <ul>
          <li><a href="https://instagram.com" target="_blank">Instagram</a></li>
          <li><a href="https://facebook.com" target="_blank">Facebook</a></li>
        </ul>
        <div class="footer-copy">
          <p>&copy; 2025 Librio.</p>
        </div>
      </div>
    </footer>
  </body>
</html>
