<!DOCTYPE html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Каталог книжок | Librio</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>Каталог Librio</h1>
      <nav>
        <ul>
          <li><a href="index.html">Головна</a></li>
          <li><a href="catalog.html" class="active">Каталог</a></li>
          <li><a href="about.html">Про нас</a></li>
          <li><a href="contact.html">Контакти</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <h2>Популярні книжки</h2>
      <ol>
        <li>
          <img
            src="images/1984.webp"
            alt="Обкладинка книжки 1984 Джорджа Орвелла"
            width="150"
          />
          <p><strong>1984</strong> — Джордж Орвелл</p>
        </li>
        <li>
          <img
            src="images/orientexpress.webp"
            alt="Обкладинка книжки Убивство у Східному експресі"
            width="150"
          />
          <p><strong>Убивство у «Східному експресі»</strong> — Аґата Крісті</p>
        </li>
      </ol>

      <form action="#" method="get">
        <label for="search">Пошук книжок:</label>
        <input
          type="text"
          id="search"
          name="q"
          placeholder="Введіть назву..."
        />
        <button type="submit">Пошук</button>
      </form>
    </main>

    <footer>
      <p>&copy; 2025 Librio.</p>
    </footer>
  </body>
