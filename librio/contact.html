<!DOCTYPE html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Контакти | Librio</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>Зв’яжіться з нами</h1>
      <nav>
        <ul>
          <li><a href="index.html">Головна</a></li>
          <li><a href="catalog.html">Каталог</a></li>
          <li><a href="about.html">Про нас</a></li>
          <li><a href="contact.html" class="active">Контакти</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <h2>Контактна форма</h2>
      <p>Якщо у вас є запитання або пропозиції, будь ласка, напишіть нам:</p>

      <form action="#" method="post">
        <label for="name">Ваше ім’я:</label>
        <input type="text" id="name" name="name" required />

        <label for="email">Ваш Email:</label>
        <input type="email" id="email" name="email" required />

        <label for="message">Повідомлення:</label>
        <textarea
          id="message"
          name="message"
          rows="4"
          placeholder="Ваше повідомлення..."
          required
        ></textarea>

        <button type="submit">Надіслати</button>
      </form>

      <h3>Або зв’яжіться напряму</h3>
      <ul>
        <li>Email: <a href="mailto:info@librio.com">info@librio.com</a></li>
        <li>
          Instagram:
          <a href="https://instagram.com/librio" target="_blank">@librio</a>
        </li>
      </ul>

    </main>

    <footer>
      <p>&copy; 2025 Librio.</p>
    </footer>
  </body>
</html>
